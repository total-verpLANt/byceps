<style>
  /* ============================================================
     BOARD — "Schwarzes Brett / Leserforum" treatment.

     The stock board pages (category_index, category_view,
     topic_view) had no .bote-page wrapper, so the .itemlist
     category/topic ledgers and the .user-comment postings ran
     full-bleed across the viewport and slid under the sticky
     masthead — the same problem the dashboard/tickets/shop
     pages had.

     Each board template now wraps its body in the centered
     1320px paper sheet (.bote-page .board-page) with a
     .page-folio + .page-head, and pulls in this shared style
     block from each page's head block. We re-set the stock BYCEPS
     ledger tables, the board-index links, and the .user-comment
     postings as newspaper "Leserbrief" furniture. Markup,
     endpoints and Jinja logic are unchanged from the stock
     templates — only the wrapper + a couple of classes were
     added, so reactions, the actions dropdown, the inline reply
     form, moderation links and pagination still work. Every
     colour is a theme token, so "Spätausgabe" (dark) is
     automatic.
     ============================================================ */

  /* ---- breadcrumbs as a mono dateline ---- */
  .board-page .breadcrumbs{margin:0 0 6px;}
  .board-page .breadcrumbs ol{
    list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--inkMute);
  }
  .board-page .breadcrumbs li{display:inline-flex;align-items:center;gap:8px;}
  .board-page .breadcrumbs li + li::before{content:"»";color:var(--inkMute);}
  .board-page .breadcrumbs a{color:var(--redDeep);text-decoration:none;border-bottom:1px dashed transparent;}
  .board-page .breadcrumbs a:hover{border-bottom-color:var(--redDeep);}
  .board-page .breadcrumbs.is-compact{margin:22px 0 0;}

  /* ---- section headings: "Rubriken", "Zuletzt aktive Einträge" ---- */
  .board-page h2{
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--redDeep);font-weight:700;margin:34px 0 12px;padding-bottom:8px;
    border-bottom:1.5px solid var(--ink);
  }

  /* ============ LEDGER TABLES (.itemlist) ============ */
  .board-page .itemlist{width:100%;border-collapse:collapse;margin:0 0 6px;}
  .board-page .itemlist thead th{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--inkMute);font-weight:700;text-align:left;padding:10px 14px 9px;
    border-bottom:3px double var(--ink);white-space:nowrap;
  }
  .board-page .itemlist thead th.centered{text-align:center;}
  .board-page .itemlist tbody td{
    font-family:var(--body);font-size:18px;color:var(--ink);padding:16px 14px;
    border-bottom:1px solid var(--paperDark);vertical-align:middle;
  }
  .board-page .itemlist tbody tr:last-child td{border-bottom:1.5px solid var(--ink);}
  .board-page .itemlist td.centered{text-align:center;}
  .board-page .itemlist td.nowrap{white-space:nowrap;}
  .board-page .itemlist tbody tr.dimmed{opacity:.5;}
  .board-page .itemlist tbody tr.dimmed em{font-style:italic;color:var(--inkMute);}
  .board-page .itemlist tbody tr:target td{
    background:repeating-linear-gradient(135deg,rgba(168,40,28,.07) 0 8px,transparent 8px 16px);
  }

  /* counts as display "Auflagenziffern" */
  .board-page .itemlist .bignumber{
    font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;
    line-height:1;letter-spacing:-.01em;color:var(--ink);
  }

  /* the whole title cell is a disguised block link */
  .board-page .board-index-item-link{
    display:block;margin:0;padding:0;text-decoration:none;color:inherit;
  }
  .board-page .board-index-item-link:hover .board-index-item-title strong{color:var(--redDeep);}
  .board-page .board-index-item-title{
    display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 9px;
  }
  .board-page .board-index-item-title strong{
    font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05;
    letter-spacing:-.01em;color:var(--ink);transition:color .12s ease;
  }
  .board-page .board-index-item-meta{
    font-family:var(--body);font-style:italic;font-size:15px;line-height:1.4;
    color:var(--inkSoft);margin-top:4px;
  }
  /* status icons in front of a topic title (announce / lock / pin / hidden) */
  .board-page .board-index-item-title .icon{
    width:14px;height:14px;color:var(--redDeep);transform:translateY(2px);
  }

  /* "category" pill under a recent topic */
  .board-page .board-category-tag{
    display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--inkSoft);
    border:1.5px solid var(--inkSoft);padding:3px 8px;font-style:normal;
  }

  /* "new" flag */
  .board-page .tag.board-index-tag-new{
    display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--redDeep);
    border:none;padding:3px 7px;border-radius:0;margin:0;
  }

  /* latest-post cell: mono dateline + small framed avatar + name */
  .board-page .itemlist td.nowrap{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--inkSoft);line-height:1.7;
  }
  .board-page .itemlist td .nowrap{white-space:nowrap;}
  .board-page .itemlist .avatar{
    display:inline-block;vertical-align:middle;border:1px solid var(--ink);
    background:var(--paperDark);margin-right:5px;line-height:0;
  }
  .board-page .avatar img{
    display:block;width:100%;height:100%;object-fit:cover;
    filter:grayscale(1) sepia(.30) contrast(1.05);transition:filter .4s ease;
  }
  /* bloom to full colour on hover — same treatment as the profile portrait
     and gallery / sponsor-grid prints (sepia at rest → filter:none on hover) */
  .board-page .avatar:hover img{filter:none;}
  .board-page .avatar.size-16{width:18px;height:18px;}

  /* ============ POSTINGS — "Leserbriefe" ============ */
  .board-page .user-comments{margin:8px 0 0;display:flex;flex-direction:column;gap:clamp(20px,2.6vw,30px);}
  .board-page .user-comment{
    display:grid;grid-template-columns:140px minmax(0,1fr);gap:0;flex-wrap:nowrap;
    margin:0;border:1.5px solid var(--ink);background:var(--paperLite);box-shadow:5px 5px 0 var(--ink);
  }
  .board-page .user-comment.dimmed{opacity:.55;}
  .board-page .user-comment:target{box-shadow:5px 5px 0 var(--redDeep);border-color:var(--redDeep);}

  /* aside: author plate */
  .board-page .user-comment-aside{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:18px 14px;border-right:1.5px solid var(--ink);
    background:repeating-linear-gradient(135deg,rgba(128,116,86,.07) 0 8px,transparent 8px 16px);
    text-align:center;
  }
  .board-page .user-comment-aside .creator .avatar{
    width:96px;height:96px;border:1.5px solid var(--ink);background:var(--paperDark);
    box-shadow:3px 3px 0 var(--ink);line-height:0;
  }
  .board-page .user-comment-aside .creator .avatar.orga{border-color:var(--redDeep);box-shadow:3px 3px 0 var(--redDeep);}
  .board-page .user-comment-aside .tag{
    display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--inkSoft);border:1.5px solid var(--inkSoft);
    padding:3px 7px;background:transparent;border-radius:0;white-space:nowrap;
  }
  .board-page .user-comment-aside .tag .icon{width:9px;height:9px;}
  .board-page .user-comment-aside .user-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;}
  .board-page .user-comment-aside .user-badges img{width:24px;height:24px;}

  /* main: the letter itself */
  .board-page .user-comment-main{display:flex;flex-direction:column;min-width:0;position:relative;}
  .board-page .user-comment-main header{
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    background:transparent;border:none;border-bottom:1.5px solid var(--ink);border-radius:0;
    padding:11px 18px;width:100%;font-size:inherit;
  }
  .board-page .user-comment-meta-top{margin:0;padding:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 14px;}
  .board-page .user-comment-meta-top > *{display:inline-block;padding:0;}
  .board-page .user-comment-meta-top .user-link a,
  .board-page .user-comment-meta-top .user-link{
    font-family:var(--display);font-style:italic;font-weight:700;font-size:21px;letter-spacing:-.01em;
    color:var(--ink);text-decoration:none;border:none;
  }
  .board-page .user-comment-meta-top .user-link a:hover{color:var(--redDeep);}
  .board-page .user-comment-meta-top a.user-comment-permalink{
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--inkMute);border:none;text-decoration:none;
  }
  .board-page .user-comment-meta-top a.user-comment-permalink:hover{color:var(--redDeep);}
  /* "Topic starter" outlined chip */
  .board-page .user-comment-meta-top .tag{
    font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--redDeep);border:1.5px solid var(--redDeep);padding:3px 7px;background:transparent;border-radius:0;
  }
  .board-page .user-comment-meta-top .tag.board-index-tag-new{color:var(--paper);background:var(--redDeep);border:none;}

  /* actions dropdown trigger */
  .board-page .user-comment-actions{margin:0;padding:0;}
  .board-page .user-comment-actions .dropdown-toggle{
    display:inline-flex;align-items:center;gap:5px;margin:0;padding:7px 11px;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--inkSoft);
    background:transparent;border:1.5px solid var(--inkSoft);border-radius:0;cursor:pointer;
  }
  .board-page .user-comment-actions .dropdown-toggle .icon{width:12px;height:12px;}
  .board-page .user-comment-actions :is(.dropdown:hover,.dropdown.open) .dropdown-toggle{
    background:var(--ink);color:var(--paper);border-color:var(--ink);
  }
  .board-page .user-comment-actions .dropdown-menu{
    border:1.5px solid var(--ink);background:var(--paperLite);box-shadow:4px 4px 0 var(--ink);
    border-radius:0;padding:4px;list-style:none;margin:4px 0 0;min-width:200px;
  }
  .board-page .user-comment-actions .dropdown-item{
    display:flex;align-items:center;gap:8px;padding:9px 12px;
    font-family:var(--body);font-size:16px;color:var(--ink);text-decoration:none;border:none;
  }
  .board-page .user-comment-actions .dropdown-item .icon{width:14px;height:14px;color:var(--redDeep);}
  .board-page .user-comment-actions .dropdown-item:hover{background:var(--paperDark);color:var(--redDeep);}

  /* the body copy */
  .board-page .user-comment-main .body{
    border:none;border-radius:0;padding:18px;overflow:visible;
    font-family:var(--body);font-size:18px;line-height:1.5;color:var(--ink);
  }
  .board-page .user-comment-main .body p{margin:0 0 12px;}
  .board-page .user-comment-main .body p:last-child{margin-bottom:0;}
  .board-page .user-comment-main .body a{color:var(--redDeep);text-decoration:none;border-bottom:1px dashed var(--redDeep);}
  .board-page .user-comment-main .body img{max-width:100%;height:auto;border:1px solid var(--ink);}
  .board-page .user-comment .quote-intro{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    font-style:normal;color:var(--inkMute);margin:0 0 4px;
  }
  .board-page .user-comment .quote-intro cite{font-weight:700;font-style:normal;color:var(--redDeep);}
  .board-page .user-comment :is(blockquote,pre code){
    background:var(--paper);border:none;border-left:4px solid var(--redDeep);
    margin:6px 0 12px;padding:6px 14px;font-style:italic;color:var(--inkSoft);
  }
  .board-page .user-comment-main footer{
    flex:0 0 auto;border-top:1px dashed var(--inkSoft);margin:0;padding:8px 18px 10px;
    font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--inkMute);opacity:.8;text-align:right;
  }
  .board-page .user-comment-main footer:hover{opacity:1;}
  .board-page .user-comment-main footer p{margin:0;}
  .board-page .user-comment-main footer a{color:var(--inkMute);border:none;}

  /* reactions */
  .board-page .reactions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .board-page .button--reaction{
    display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;font-weight:700;
    padding:5px 11px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:0;box-shadow:none;cursor:pointer;user-select:none;transition:transform .12s ease,box-shadow .12s ease;
  }
  .board-page .button--reaction:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink);}
  .board-page .button--reaction[data-count="0"]{opacity:.5;}
  .board-page .button.button--reaction-active{background:var(--redDeep);color:var(--paper);border-color:var(--redDeep);box-shadow:2px 2px 0 var(--ink);}
  .board-page .button--reaction .symbol{display:flex;text-shadow:none;}
  .board-page .button--reaction .symbol img{width:16px;height:16px;}
  .board-page .reaction-count::after{content:attr(data-count);margin-left:3px;}

  /* announce / lock event rows at the foot of a topic */
  .board-page .event-row{
    display:flex;align-items:center;gap:12px;margin:0;padding:14px 18px;
    border:1.5px dashed var(--inkSoft);background:repeating-linear-gradient(135deg,rgba(128,116,86,.08) 0 7px,transparent 7px 14px);
  }
  .board-page .event-row .event-icon-container .icon{width:18px;height:18px;color:var(--redDeep);}
  .board-page .event-row .event-description{font-family:var(--body);font-style:italic;font-size:17px;line-height:1.4;color:var(--ink);}
  .board-page .event-row .event-description strong{font-style:normal;font-weight:700;}

  /* ---- inline reply form ("Ihr Leserbrief") ---- */
  .board-page .board-posting-create-form-inline .label{display:none;}
  .board-page .board-posting-create-form-inline textarea.form-control{
    width:100%;min-height:128px;resize:vertical;font-family:var(--body);font-size:18px;line-height:1.5;
    color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:0;padding:12px 14px;
  }
  .board-page .board-posting-create-form-inline textarea.form-control.collapsed{min-height:0;height:3rem;}
  .board-page .board-posting-create-form-inline textarea.form-control:focus{outline:none;border-color:var(--redDeep);box-shadow:3px 3px 0 var(--redDeep);}
  .board-page .collapsible-neighbor{margin-top:12px;}

  /* ============ FORM CONTROLS (create / reply forms) ============ */
  .board-page .form-control-block{margin-bottom:16px;}
  .board-page .form-label{
    display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--inkSoft);margin-bottom:6px;
  }
  .board-page .form-control{
    width:100%;font-family:var(--body);font-size:18px;line-height:1.4;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--ink);border-radius:0;padding:11px 13px;
  }
  .board-page textarea.form-control{min-height:160px;resize:vertical;}
  .board-page input.form-control{appearance:none;-webkit-appearance:none;}
  .board-page .form-control::placeholder{color:var(--inkMute);}
  .board-page .form-control:focus{outline:none;border-color:var(--redDeep);box-shadow:3px 3px 0 var(--redDeep);}
  .board-page .form-control:hover{border-color:var(--redDeep);}
  .board-page .form-caption,
  .board-page .form-help{font-family:var(--body);font-style:italic;font-size:14px;color:var(--inkMute);margin-top:5px;}
  .board-page .form-control-block.invalid .form-control{border-color:var(--red);}
  .board-page .form-errors{list-style:none;margin:7px 0 0;padding:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--red);}
  .board-page .form-errors strong{text-transform:uppercase;letter-spacing:.12em;}
  /* BBCode hint under the editor */
  .board-page form small{display:block;margin-top:10px;font-family:var(--body);font-style:italic;font-size:14px;color:var(--inkMute);}
  .board-page form small a{color:var(--redDeep);text-decoration:none;border-bottom:1px dashed var(--redDeep);}
  .board-page .mb{margin-bottom:18px;}

  /* ============ BUTTONS ============ */
  .board-page .button-row{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 4px;}
  .board-page .button-row.is-right-aligned{justify-content:flex-end;}
  .board-page .button-row.is-hcentered{justify-content:center;}
  .board-page .button{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:13px 28px;border:1.5px solid var(--ink);background:var(--paperLite);color:var(--ink);
    text-decoration:none;cursor:pointer;border-radius:0;box-shadow:4px 4px 0 var(--ink);
    transition:transform .14s ease,box-shadow .14s ease,background-color .14s,color .14s;
  }
  .board-page .button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
  .board-page .button:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--ink);}
  .board-page .button .icon{width:1em;height:1em;}
  .board-page .button.color-primary{background:var(--green);color:#fff;border-color:transparent;}
  .board-page .button.color-primary:hover{filter:brightness(1.06);}
  .board-page .button.is-compact{padding:9px 16px;font-size:10.5px;}
  .board-page .button.is-disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .board-page .button.is-outlined{background:transparent;}
  .board-page .button.is-clear{background:transparent;box-shadow:none;border-color:transparent;}
  .board-page .button.is-clear:hover{transform:none;box-shadow:none;color:var(--redDeep);}

  /* ============ PAGINATION ============ */
  .board-page .pagination{margin:22px 0;}
  .board-page .pagination ol{
    list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;
  }
  .board-page .pagination-item a,
  .board-page .pagination-item span{
    display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 10px;
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;
    border:1.5px solid var(--ink);background:var(--paperLite);
  }
  .board-page .pagination-item a:hover{background:var(--ink);color:var(--paper);}
  .board-page .pagination-item.pagination--current span{background:var(--redDeep);color:var(--paper);border-color:var(--redDeep);}
  .board-page .pagination .icon{width:13px;height:13px;}

  /* ============ NOTIFICATION + EMPTY STATE ============ */
  .board-page .notification{
    display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--ink);border-left:7px solid var(--redDeep);
    background:var(--paperLite);padding:15px 20px;box-shadow:4px 4px 0 var(--ink);margin:0 0 22px;border-radius:0;max-width:none;
  }
  .board-page .notification.color-info{border-left-color:var(--ink);}
  .board-page .notification .block-with-icon-icon{color:var(--redDeep);font-size:20px;line-height:1.1;flex:0 0 auto;}
  .board-page .notification .block-with-icon-icon .icon{width:1em;height:1em;}
  .board-page .notification .block-with-icon-body{font-family:var(--body);font-style:italic;font-size:18px;line-height:1.4;color:var(--ink);}

  /* solid box wraps the editor form fields (create/update) */
  .board-page .main-body-box{
    border:1.5px solid var(--ink);background:var(--paperLite);box-shadow:5px 5px 0 var(--ink);
    padding:22px clamp(18px,2.4vw,26px);margin:0 0 10px;border-radius:0;
  }
  .board-page .main-body-box .form-control-block:last-child{margin-bottom:0;}
  /* dashed slip is reserved for the "no topics" empty state */
  .board-page .main-body-box.is-empty,
  .board-category-page .main-body-box{
    border:1.5px dashed var(--inkSoft);background:repeating-linear-gradient(135deg,rgba(128,116,86,.10) 0 7px,transparent 7px 14px);
    box-shadow:none;padding:26px 24px;
  }
  .board-page .main-body-box .dimmed,
  .board-page .main-body-box > p{
    font-family:var(--body);font-style:italic;font-size:19px;line-height:1.45;color:var(--inkSoft);margin:0;
  }

  /* small "log in to take part" note */
  .board-page small p{font-family:var(--body);font-style:italic;font-size:15px;color:var(--inkSoft);}
  .board-page small a{color:var(--redDeep);text-decoration:none;border-bottom:1px dashed var(--redDeep);}

  /* ============ RESPONSIVE ============ */
  @media (max-width:720px){
    .board-page .user-comment{grid-template-columns:1fr;}
    .board-page .user-comment-aside{
      flex-direction:row;justify-content:flex-start;border-right:none;border-bottom:1.5px solid var(--ink);
      padding:12px 16px;gap:14px;text-align:left;
    }
    .board-page .user-comment-aside .creator .avatar{width:56px;height:56px;}
    .board-page .itemlist tbody td{font-size:16px;padding:13px 10px;}
    .board-page .board-index-item-title strong{font-size:20px;}
  }
</style>
