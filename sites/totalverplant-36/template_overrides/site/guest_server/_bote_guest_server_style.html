<style>
  /* ============================================================
     GÄSTESERVER / "Mitgebrachte Kisten" — Netzwart treatment.

     Shared by both pages of the guest-server flow:
       site/guest_server/index.html        (Übersicht / Liste)
       site/guest_server/create_form.html  (Schritt 1: Anzahl ·
                                             Schritt 2: Steckbrief)

     The stock pages had no .bote-page wrapper and rendered the
     BYCEPS itemlist + raw form controls full-bleed under the
     sticky masthead (same problem the dashboard / tickets / auth
     pages had). Each template now wraps its body in the centered
     paper sheet (.bote-page .gs-page) with a .page-folio +
     .page-head and pulls in this shared <style> partial.

     The registered-server list is re-set as newspaper classified
     cards; the two registration steps re-use the stock form_field
     / form_buttons macros (field names, validation, endpoints and
     the .lan suffix are UNCHANGED — only wrappers + classes were
     added), styled as a stamped "Formular beim Netzwart". Every
     colour is a theme token, so "Spätausgabe" (dark) is automatic.
     ============================================================ */

  /* ===== list toolbar (heading + register action) ===== */
  .gs-page .gs-toolbar{
    display:flex; justify-content:space-between; align-items:center; gap:16px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--ink); padding-bottom:14px; margin-bottom:22px;
  }
  .gs-page .gs-toolbar h2{
    font-family:var(--display); font-weight:900; font-style:normal; letter-spacing:-.02em;
    font-size:clamp(1.5rem,2.4vw,2.1rem); margin:0;
  }
  .gs-page .gs-action{
    display:inline-flex; align-items:center; gap:9px; font-family:var(--mono); font-size:12px; font-weight:700;
    letter-spacing:.18em; text-transform:uppercase; padding:13px 22px; border:1.5px solid var(--ink);
    background:var(--paperLite); color:var(--ink); text-decoration:none; cursor:pointer; border-radius:0;
    box-shadow:4px 4px 0 var(--ink); transition:transform .14s ease,box-shadow .14s ease,background-color .14s,color .14s;
  }
  .gs-page .gs-action:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); background:var(--ink); color:var(--paper); }
  .gs-page .gs-action:active{ transform:translate(0,0); box-shadow:2px 2px 0 var(--ink); }
  .gs-page .gs-action .plus{ font-family:var(--display); font-weight:900; font-size:17px; line-height:0; }
  .gs-page .gs-action .icon{ width:1em; height:1em; }

  /* ===== empty state ===== */
  .gs-page .gs-empty{
    font-family:var(--body); font-style:italic; font-size:19px; color:var(--inkMute);
    border:1.5px dashed var(--inkMute); padding:26px clamp(18px,3vw,30px); text-align:center;
    background:repeating-linear-gradient(135deg,rgba(128,116,86,.10) 0 7px,transparent 7px 14px);
  }
  .gs-page .gs-empty .ge-mark{
    display:block; font-family:var(--display); font-weight:900; font-style:italic;
    font-size:30px; color:var(--inkSoft); margin-bottom:6px;
  }

  /* ===== registered-server card (newspaper classified) ===== */
  .gs-page .gs-list{ display:grid; gap:18px; margin:0 0 26px; }
  .gs-page .gs-card{
    border:1.5px solid var(--ink); background:var(--paperLite); box-shadow:5px 5px 0 var(--ink);
    display:grid; grid-template-columns:1fr;
  }
  .gs-page .gs-card .gc-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px 18px; flex-wrap:wrap;
    border-bottom:3px double var(--ink); padding:11px clamp(16px,2.2vw,22px) 10px; background:var(--paper);
  }
  .gs-page .gs-card .gc-desc{
    font-family:var(--display); font-weight:800; font-style:italic; font-size:clamp(20px,2.2vw,26px);
    letter-spacing:-.01em; margin:0; line-height:1.05;
  }
  .gs-page .gs-card .gc-stamp{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
    font-weight:700; white-space:nowrap;
  }
  .gs-page .gs-card .gc-stamp.is-approved{ color:var(--green); }
  .gs-page .gs-card .gc-stamp.is-pending{ color:var(--redDeep); }
  .gs-page .gs-card .gc-body{
    padding:clamp(14px,2.2vw,20px) clamp(16px,2.2vw,22px) clamp(16px,2.4vw,22px);
    display:grid; grid-template-columns:1fr 1fr; gap:16px clamp(20px,3vw,40px);
  }
  .gs-page .gs-spec{ display:grid; gap:5px; align-content:start; }
  .gs-page .gs-spec .gs-k{
    font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--inkMute); font-weight:700;
  }
  .gs-page .gs-spec .gs-v{ font-family:var(--body); font-size:18px; line-height:1.4; color:var(--ink); }
  .gs-page .gs-spec .gs-v code,
  .gs-page .gs-spec .gs-v .monospace{
    font-family:var(--mono); font-size:13.5px; color:var(--ink);
    background:var(--paper); border:1px solid var(--inkMute); padding:1px 6px; border-radius:0;
  }
  .gs-page .gs-spec--wide{ grid-column:1 / -1; }
  .gs-page .gs-spec .gs-note{ font-style:italic; color:var(--inkSoft); font-size:16px; }
  .gs-page .gs-spec .gs-dim{ color:var(--inkMute); font-style:italic; }

  /* approved-address ledger inside a card (Hostname · IP · Netz · Gateway) */
  .gs-page .gs-addr{
    grid-column:1 / -1; display:grid; grid-template-columns:repeat(4,1fr); gap:6px clamp(16px,2.4vw,30px);
    border-top:1px solid var(--paperDark); padding-top:14px; margin-top:2px;
  }
  .gs-page .gs-addr .ga-k{
    font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--inkMute); font-weight:700;
  }
  .gs-page .gs-addr .ga-v{ font-family:var(--mono); font-size:13.5px; color:var(--ink); line-height:1.5; word-break:break-all; }
  .gs-page .gs-addr .ga-dim{ font-family:var(--body); font-style:italic; font-size:15px; color:var(--inkMute); }

  /* printable-card link, sits under the card body as a small register action */
  .gs-page .gs-card-foot{
    grid-column:1 / -1; display:flex; justify-content:flex-end; padding-top:12px; margin-top:2px;
    border-top:1px solid var(--paperDark);
  }
  .gs-page .gs-link{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--redDeep); text-decoration:none;
    border-bottom:1px dashed var(--redDeep);
  }
  .gs-page .gs-link:hover{ background:rgba(168,40,28,.07); }
  .gs-page .gs-link .icon{ width:1em; height:1em; }

  /* ===== Further Settings (DNS / Domain) — small inked ledger ===== */
  .gs-page .gs-settings{
    border:1.5px solid var(--ink); background:var(--paper); box-shadow:4px 4px 0 var(--ink);
    padding:clamp(14px,2vw,20px) clamp(16px,2.2vw,22px);
    display:grid; grid-template-columns:1fr 1fr; gap:14px clamp(20px,3vw,40px);
  }
  .gs-page .gs-settings .gs-shead{
    grid-column:1 / -1; font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--redDeep); font-weight:700; padding-bottom:8px; border-bottom:1px solid var(--ink); margin-bottom:2px;
  }

  @media (max-width:640px){
    .gs-page .gs-card .gc-body{ grid-template-columns:1fr; }
    .gs-page .gs-addr{ grid-template-columns:1fr 1fr; }
    .gs-page .gs-settings{ grid-template-columns:1fr; }
  }

  /* ============================================================
     FORM (Schritt 1 + 2) — mirrors site/authn/_bote_auth_style.html
     ============================================================ */
  .gs-form .form-shell{ max-width:42rem; }

  /* breadcrumb (re-set of the stock .breadcrumbs trail) */
  .gs-form .gs-crumbs{
    font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--inkMute); margin:0 0 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; list-style:none; padding:0;
  }
  .gs-form .gs-crumbs a{ color:var(--redDeep); font-weight:700; text-decoration:none; border-bottom:1.5px solid transparent; }
  .gs-form .gs-crumbs a:hover{ border-bottom-color:var(--redDeep); }
  .gs-form .gs-crumbs .sep{ color:var(--inkMute); }

  /* the inked paper card (stock .main-body-box) */
  .gs-form .main-body-box{
    border:1.5px solid var(--ink); background:var(--paperLite); box-shadow:6px 6px 0 var(--ink);
    border-radius:0; padding:0; margin:0; overflow:hidden;
  }
  .gs-form .form-cardhead{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px 18px; flex-wrap:wrap;
    padding:11px clamp(18px,2.4vw,26px) 10px; border-bottom:3px double var(--ink); background:var(--paper);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--inkSoft);
  }
  .gs-form .form-cardhead .ah-form{ color:var(--redDeep); font-weight:700; }
  .gs-form .form-cardhead .ah-no{ color:var(--inkMute); }
  .gs-form .form-cardbody{ padding:clamp(20px,2.6vw,30px) clamp(18px,2.4vw,28px); }

  /* ===== form controls (form_field macro) ===== */
  .gs-form .form-control-block{ margin-bottom:22px; }
  .gs-form .form-control-block:last-child{ margin-bottom:0; }
  .gs-form .form-label{
    display:block; font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.18em;
    text-transform:uppercase; color:var(--inkSoft); margin-bottom:7px;
  }
  /* common.css inks raw inputs #fff via `input.form-control:not([type=checkbox]):not([type=radio])`
     (a 0,3,1 selector) — re-assert the paper card controls one notch above (0,4,1), in tokens, so
     both editions stay legible (the same fix documented in _bote_auth_style.html). */
  .gs-form input.form-control:not([type='checkbox']):not([type='radio']),
  .gs-form select.form-control,
  .gs-form textarea.form-control{
    width:100%; font-family:var(--body); font-size:19px; line-height:1.3; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--ink); border-radius:0; padding:12px 14px;
  }
  .gs-form input.form-control{ appearance:none; -webkit-appearance:none; }
  .gs-form select.form-control{
    appearance:none; -webkit-appearance:none; cursor:pointer; padding-right:40px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 19px) 1.25em,calc(100% - 13px) 1.25em;
    background-size:6px 6px,6px 6px; background-repeat:no-repeat;
  }
  .gs-form textarea.form-control{ min-height:130px; resize:vertical; line-height:1.5; }
  .gs-form .form-control::placeholder{ color:var(--inkMute); }
  .gs-form .form-control:hover{ border-color:var(--redDeep); }
  .gs-form .form-control:focus{ outline:none; border-color:var(--redDeep); box-shadow:3px 3px 0 var(--redDeep); }
  .gs-form .form-caption{ font-family:var(--body); font-style:italic; font-size:15px; color:var(--inkMute); margin-top:7px; }
  .gs-form .form-caption code{ font-family:var(--mono); font-size:12.5px; background:var(--paper); border:1px solid var(--inkMute); padding:0 5px; }
  .gs-form .form-control-block.invalid .form-control{ border-color:var(--red); box-shadow:3px 3px 0 var(--red); }
  .gs-form .form-errors{
    list-style:none; margin:8px 0 0; padding:0; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.06em; color:var(--red);
  }
  .gs-form .form-errors strong{ text-transform:uppercase; letter-spacing:.12em; }

  /* hostname rows: the form_field suffix wraps input + chip in .form-control-wrapper */
  .gs-form .form-control-wrapper{ display:flex; align-items:stretch; max-width:30rem; }
  .gs-form .form-control-wrapper .form-control{ border-right:0; }
  .gs-form .host-suffix{
    display:inline-flex; align-items:center; padding:0 14px; border:1.5px solid var(--ink);
    background:var(--paperDark); font-family:var(--mono); font-size:15px; color:var(--inkSoft); white-space:nowrap;
  }

  /* ===== submit / cancel buttons (form_buttons) ===== */
  .gs-form .button-row{ display:flex; gap:12px; flex-wrap:wrap; margin:26px 0 0; align-items:center; }
  .gs-form .button{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    padding:15px 32px; border:1.5px solid var(--ink); background:var(--paperLite); color:var(--ink);
    text-decoration:none; cursor:pointer; border-radius:0; box-shadow:4px 4px 0 var(--ink);
    transition:transform .14s ease, box-shadow .14s ease, background-color .14s, color .14s, filter .14s;
  }
  .gs-form .button:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  .gs-form .button:active{ transform:translate(0,0); box-shadow:2px 2px 0 var(--ink); }
  .gs-form .button.color-primary{ background:var(--green); color:#fff; border-color:transparent; box-shadow:4px 4px 0 var(--ink); }
  .gs-form .button.color-primary:hover{ filter:brightness(1.08); }
  .gs-form .button.is-outlined{ background:transparent; }
  .gs-form .step-note{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--inkMute); }

  @media (max-width:600px){
    .gs-form .button{ width:100%; }
    .gs-form .form-control-wrapper{ max-width:none; }
  }
</style>
