<style>
  :root{ --kwOpen:#f7f1dc; --kwLetter:#1a1812; --kwBlock:#1a1812; --kwLine:#1a1812;
         --kwNum:#8a7f64; --kwWord:#d6dfee; --kwActive:#f0cdb4; --kwMark:#ecdfba;
         --shade:rgba(20,17,13,.55); }
  html[data-theme="dark"]{ --kwOpen:#ece3cd; --kwLetter:#14110d; --kwBlock:#0c0a06;
         --kwLine:#37301f; --kwNum:#6a6048; --kwWord:#5f7295; --kwActive:#c98a5f;
         --kwMark:#cdbf95; --shade:rgba(4,3,2,.74); }

  /* ---------------- Teaser tile (clickable) ---------------- */
  .kw-teaser{
    text-align:center;cursor:zoom-in;position:relative;outline:none;
    transition:transform .22s cubic-bezier(.34,1.4,.5,1),box-shadow .22s,border-color .22s;
  }
  .kw-teaser:hover,.kw-teaser:focus-visible{
    transform:translateY(-4px);border-color:var(--redDeep);
    box-shadow:0 14px 30px -14px var(--shade), inset 0 0 0 1px var(--redDeep);
  }
  /* reserve corner gutters so the centred heading never collides with the
     top-right magnify chip (which floats above it on hover) */
  .kw-teaser .kicker{padding:0 30px;}
  .kw-teaser .mini{display:flex;justify-content:center;margin-top:4px;}
  .kw-teaser .cap{font-style:italic;color:var(--inkSoft);font-size:12px;line-height:1.4;margin-top:9px;}
  .kw-teaser .prompt{ margin-top:11px; display:inline-flex; align-items:center; gap:7px;
    font-family:var(--body); font-style:italic; font-size:12px; letter-spacing:.04em;
    text-transform:none; color:var(--inkSoft); background:transparent; padding:2px 0;
    opacity:0; transform:translateY(5px); transition:opacity .22s,transform .22s; }
  .kw-teaser:hover .prompt,.kw-teaser:focus-visible .prompt{opacity:1;transform:translateY(0);}
  /* magnify = a floating "ink-stamp" zoom chip. Fill is always cream (--kwOpen
     is light in both themes), so glyph + ring use --kwLetter (dark in both) to
     stay legible; the --paper halo + soft shadow lift it clear of the heading. */
  .kw-teaser .magnify{
    position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;
    border:1.5px solid var(--kwLetter);background:var(--kwOpen);color:var(--kwLetter);
    display:grid;place-items:center;font-size:12px;line-height:1;z-index:3;
    box-shadow:0 2px 6px -2px var(--shade),0 0 0 3px var(--paper);
    opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;
  }
  .kw-teaser:hover .magnify,.kw-teaser:focus-visible .magnify{opacity:1;transform:scale(1);}

  /* mini grid */
  .mgrid{display:grid;gap:1px;background:var(--kwLine);border:1.5px solid var(--kwLine);}
  .mcell{width:15px;height:15px;background:var(--kwOpen);position:relative;}
  .mcell.blk{background:var(--kwBlock);}
  .mcell .mn{position:absolute;top:0;left:1px;font-family:var(--mono);font-size:6px;color:var(--kwNum);line-height:1;}

  /* ---------------- Overlay / modal ---------------- */
  .kw-overlay{position:fixed;inset:0;z-index:100;display:none;}
  .kw-overlay.show{display:block;}
  .kw-backdrop{position:absolute;inset:0;background:var(--shade);backdrop-filter:blur(3px);
    opacity:0;transition:opacity .28s;}
  .kw-overlay.show .kw-backdrop{opacity:1;}
  .kw-modal-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:18px;pointer-events:none;}
  .kw-modal{
    pointer-events:auto;width:min(1120px,100%);max-height:94vh;overflow:auto;
    background:var(--paper);border:2px solid var(--ink);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px var(--ink);
    transform-origin:top left;
  }
  .kw-modal::-webkit-scrollbar{width:10px;}
  .kw-modal::-webkit-scrollbar-thumb{background:var(--inkMute);}
  .kw-head{
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    padding:16px clamp(14px,2.4vw,26px);border-bottom:3px double var(--ink);position:sticky;top:0;
    background:var(--paper);z-index:3;
  }
  .kw-head .kick{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--redDeep);font-weight:700;}
  .kw-head h2{font-family:var(--display);font-weight:900;font-style:italic;margin:3px 0 0;
    font-size:clamp(22px,3vw,34px);letter-spacing:-.02em;}
  .kw-head .lead{font-style:italic;color:var(--inkSoft);font-size:13.5px;margin-top:3px;}
  .kw-x{flex:none;width:38px;height:38px;border:1.5px solid var(--ink);background:var(--paperLite);
    color:var(--ink);font-size:18px;cursor:pointer;font-family:var(--mono);line-height:1;}
  .kw-x:hover{background:var(--ink);color:var(--paper);}

  .kw-body{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,2.6vw,34px);
    padding:clamp(16px,2.4vw,26px);align-items:start;}
  @media(max-width:780px){.kw-body{grid-template-columns:1fr;}}

  .kw-left{display:flex;flex-direction:column;gap:14px;align-items:center;}
  .grid-wrap{position:relative;}
  .kw-grid{
    --cell:clamp(19px,4.3vw,33px);
    display:grid;grid-template-columns:repeat(15,var(--cell));grid-auto-rows:var(--cell);
    gap:1px;background:var(--kwLine);border:2px solid var(--kwLine);user-select:none;
  }
  .cell{position:relative;background:var(--kwOpen);display:grid;place-items:center;}
  .cell.blk{background:var(--kwBlock);}
  .cell .num{position:absolute;top:0px;left:2px;font-family:var(--mono);
    font-size:calc(var(--cell)*.27);color:var(--kwNum);line-height:1;pointer-events:none;}
  .cell .let{font-family:var(--display);font-weight:700;color:var(--kwLetter);
    font-size:calc(var(--cell)*.6);line-height:1;text-transform:uppercase;}
  .cell.mark{background:var(--kwMark);}
  .cell.mark::after{content:attr(data-mk);position:absolute;bottom:0px;right:0px;
    width:calc(var(--cell)*.34);height:calc(var(--cell)*.34);border-radius:50%;
    background:var(--redDeep);color:#fff;font-family:var(--mono);font-size:calc(var(--cell)*.2);
    font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 1px var(--paper);}
  .cell.word{background:var(--kwWord);}
  .cell.mark.word{background:color-mix(in srgb,var(--kwWord) 70%,var(--kwMark));}
  .cell.active{background:var(--kwActive);box-shadow:inset 0 0 0 2px var(--redDeep);}
  .cell.wrong{animation:shake .4s;box-shadow:inset 0 0 0 2px var(--red);}
  .cell.wrong .let{color:var(--red);}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  #kwInput{position:absolute;opacity:0;width:1px;height:1px;border:0;padding:0;pointer-events:none;
    font-size:16px;left:-9999px;}

  /* Lösungswort bar */
  .loes{width:100%;}
  .loes .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--inkSoft);margin-bottom:6px;text-align:center;}
  .loes-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding-top:9px;}
  .lbox{width:clamp(22px,4.6vw,30px);height:clamp(26px,5.4vw,36px);border:1.5px solid var(--ink);
    background:var(--kwOpen);display:grid;place-items:center;position:relative;}
  .lbox .li{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:15px;height:15px;
    border-radius:50%;background:var(--redDeep);color:#fff;font-family:var(--mono);font-size:8px;font-weight:700;
    display:grid;place-items:center;line-height:1;box-shadow:0 0 0 1.5px var(--paper);}
  .lbox .ll{font-family:var(--display);font-weight:800;color:var(--kwLetter);font-size:16px;text-transform:uppercase;}
  .loes.solved .lbox{background:var(--green);border-color:var(--green);}
  .loes.solved .lbox .ll{color:#fff;}
  .loes.solved .lbox .li{color:#fff;}
  .lbox.has{box-shadow:inset 0 0 0 2px var(--redDeep);}
  .lbox.has .ll{animation:pop .22s ease;}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .loes-verdict{font-family:var(--sans);font-weight:700;letter-spacing:.02em;font-size:11.5px;
    padding:2px 9px;text-transform:none;display:none;vertical-align:1px;}
  .loes-verdict.ok{display:inline-block;color:#fff;background:var(--green);}
  .loes-verdict.no{display:inline-block;color:#fff;background:var(--red);}

  .kw-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;padding:9px 14px;border:1.5px solid var(--ink);background:var(--paperLite);
    color:var(--ink);cursor:pointer;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.solid{background:var(--redDeep);color:var(--paper);border-color:var(--redDeep);}
  .btn.solid:hover{background:var(--red);}

  /* clues */
  .kw-clues{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,26px);}
  @media(max-width:520px){.kw-clues{grid-template-columns:1fr;}}
  .clue-h{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--redDeep);font-weight:700;border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:8px;}
  .clue-list{list-style:none;margin:0;padding:0;}
  .clue-list li{display:flex;gap:9px;padding:6px 6px;font-size:15px;line-height:1.32;cursor:pointer;
    border-left:2px solid transparent;}
  .clue-list li:hover{background:color-mix(in srgb,var(--kwWord) 40%,transparent);}
  .clue-list li.on{background:color-mix(in srgb,var(--kwWord) 70%,transparent);border-left-color:var(--redDeep);}
  .clue-list li.done{color:var(--inkMute);}
  .clue-list li.done span:nth-child(2){text-decoration:line-through;text-decoration-color:var(--inkMute);}
  .clue-list li .cn{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--redDeep);min-width:18px;text-align:right;}
  .clue-list li .cstat{margin-left:auto;font-weight:800;font-size:14px;padding-left:8px;text-decoration:none;}
  .clue-list li .cstat.ok{color:var(--green);}
  .clue-list li .cstat.no{color:var(--red);}

  /* solved stamp */
  .stamp{position:absolute;top:54%;left:50%;transform:translate(-50%,-50%) rotate(-11deg) scale(.4);
    font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(46px,9vw,92px);
    color:var(--red);border:5px double var(--red);padding:6px 26px;letter-spacing:.04em;
    opacity:0;pointer-events:none;z-index:5;text-transform:uppercase;background:color-mix(in srgb,var(--paper) 70%,transparent);}
  .stamp.show{animation:stampin .5s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes stampin{to{opacity:.94;transform:translate(-50%,-50%) rotate(-11deg) scale(1);}}

  .hint-line{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--inkMute);
    text-align:center;line-height:1.6;}
  .ic{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;
    background:var(--redDeep);color:#fff;font-family:var(--mono);font-size:.72em;font-weight:700;
    line-height:1;vertical-align:middle;position:relative;top:-0.06em;margin:0 .1em;}
</style>
