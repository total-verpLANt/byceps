<style>
/* ============================================================
   Kopfband (beamershow): one line of called numbers, meant to be
   embedded above a beamershow. .hb is the size container; every
   size is in cqh, so the band scales with the height it is given,
   capped at a 1920x110 ratio so a full window stays a headband.
   Numbers that do not fit wrap out of sight, never half cut.
   Standalone: loads no site layout.
   ============================================================ */
html,body{margin:0;height:100%;background:var(--paper)}
body{background-image:none;animation:none;transition:none;overflow:hidden}
.hb{container-type:size;height:min(100%,5.75vw);overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--mono)}
.hb-band{box-sizing:border-box;height:100%;display:flex;align-items:stretch;border-bottom:max(2px,3cqh) double var(--ink)}
.hb-label{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;padding:0 12cqh;background:var(--red);color:var(--paper)}
.hb-label b{font-family:var(--display);font-style:italic;font-weight:900;font-size:38cqh;line-height:1}
.hb-label span{margin-top:3cqh;font-size:11cqh;font-weight:700;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.hb-row{flex:1 1 auto;min-width:0;height:100%;list-style:none;margin:0;padding:0 0 0 12cqh;display:flex;flex-wrap:wrap;gap:0 20cqh;overflow:hidden}
.hb-row li{flex:0 0 auto;height:100%;display:flex;align-items:center;gap:2cqh;white-space:nowrap}
.hb-row i{font-style:normal;font-size:22cqh;color:var(--red)}
.hb-row b{font-size:36cqh;line-height:1;font-weight:700;font-feature-settings:"zero" 1;letter-spacing:.02em;color:var(--inkSoft)}
.hb-row .hb-fresh b{color:var(--ink)}
.hb-more[hidden]{display:none}
.hb-more{flex:0 0 auto;display:flex;align-items:center;gap:4cqh;margin:14cqh 8cqh 14cqh 6cqh;padding:0 6cqh;background:var(--ink);color:var(--paper)}
.hb-more b{font-family:var(--display);font-weight:900;font-variant-numeric:lining-nums;font-size:44cqh;line-height:1;white-space:nowrap}
.hb-more span{display:flex;flex-direction:column;gap:2cqh;font-size:10cqh;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.hb-empty{flex:1 1 auto;margin:0;padding:0 8cqh;display:flex;align-items:center;gap:0 .4em;font-family:var(--display);font-style:italic;font-weight:900;font-size:30cqh;white-space:nowrap;overflow:hidden}
</style>
