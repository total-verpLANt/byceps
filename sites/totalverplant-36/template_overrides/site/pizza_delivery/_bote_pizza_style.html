<style>
/* ============================================================
   KANTINE · ESSENSAUSGABE — pizza_delivery pages.
   Shared by the board and the pickup slip page.
   Tokens only; both editions resolve through the token swap.
   Layout reacts to its own width (container queries), not the
   viewport, so the same rules serve the sheet, the phone and
   the projector.
   ============================================================ */
.pizza-page{container:pz/inline-size;--pz-gap:clamp(18px,2.4vw,26px)}
.pz-num,.pz-lead-no,.pz-no b,.pz-slip-no,.pz-flash-no,.xb-lead-no,.xb-reg b{font-family:var(--mono);font-weight:700;font-style:normal;font-feature-settings:"zero" 1;letter-spacing:.02em;overflow-wrap:anywhere}
.pz-link{display:inline-flex;align-items:center;min-height:44px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--redDeep);text-decoration:underline dashed;text-underline-offset:5px;white-space:nowrap}
.pz-link:hover{color:var(--ink)}
.pizza-page :focus-visible,.xb :focus-visible{outline:3px solid var(--redDeep);outline-offset:3px}
.page-head .ph-meta .pz-link{min-height:32px;font-size:10px}

/* reader strip: personal state, never shown for other readers */
.pz-reader{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px;margin:0 0 var(--pz-gap);padding:8px 16px;border:1.5px solid var(--ink);background:var(--paperLite)}
.pz-reader p{margin:0;flex:1 1 30ch;font-size:19px;line-height:1.4;padding:6px 0}
.pz-reader .pz-num{font-size:.95em}
.pz-reader .pz-stamp{margin:4px 0}

/* Eilmeldung */
.pz-flash{margin:0 0 var(--pz-gap);border:3px solid var(--redDeep);background:var(--paperLite);box-shadow:6px 6px 0 var(--ink)}
.pz-flash-h{display:flex;justify-content:space-between;gap:12px;background:var(--redDeep);color:var(--paper);padding:8px 16px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.pz-flash-b{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 32px;padding:16px 18px 20px}
.pz-flash h2{font-family:var(--display);font-weight:900;font-size:clamp(28px,3.4vw,42px);line-height:1;letter-spacing:-.02em;margin:0;color:var(--ink)}
.pz-flash p{margin:0;font-size:20px;line-height:1.4;font-style:italic;color:var(--inkSoft)}
.pz-flash-nos{grid-column:2;grid-row:1/3;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 22px;margin:0;padding:0;list-style:none}
.pz-flash-no{font-size:64px;line-height:1;color:var(--redDeep)}
@container pz (max-width:640px){
 .pz-flash-b{grid-template-columns:minmax(0,1fr);padding:14px 14px 16px}
 .pz-flash-nos{grid-column:auto;grid-row:auto;justify-content:flex-start}
 .pz-flash-no{font-size:44px}
 .pz-flash{box-shadow:4px 4px 0 var(--ink)}
}

/* Die Gewinnzahlen */
.pz-draw{container:pzd/inline-size;border:2px solid var(--ink);background:var(--paperLite)}
.pz-draw-h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;background:var(--ink);color:var(--paper);padding:8px 16px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.pz-draw-h h2{font:inherit;margin:0}
.pz-lead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px 24px;padding:20px 18px 22px;border-bottom:3px double var(--ink)}
.pz-lead .kicker{margin:0 0 10px}
.pz-lead-no{display:block;margin:0;line-height:.95;color:var(--ink)}
.pz-len-s .pz-lead-no{font-size:min(136px,22cqi)}
.pz-len-m .pz-lead-no{font-size:min(96px,12cqi)}
.pz-len-l .pz-lead-no{font-size:min(64px,7.4cqi)}
.pz-lead.is-mine .pz-lead-no{color:var(--redDeep)}
.pz-tags{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pz-tag{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border:1.5px solid currentColor;padding:6px 10px;color:var(--redDeep);white-space:nowrap}
.pz-tag--fresh::before{content:"✶ "}
.pz-tag--mine{background:var(--redDeep);border-color:var(--redDeep);color:var(--paper)}
.pz-reg-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0;padding:14px 18px 0;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--inkSoft)}
.pz-reg-h h3{font:inherit;margin:0;color:var(--ink)}
.pz-reg{list-style:none;margin:0;padding:12px 18px 20px;display:flex;flex-wrap:wrap;gap:8px}
.pz-no{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:7px 11px 8px;border:1px solid var(--inkMute);background:var(--paper);max-width:100%;min-width:0}
.pz-no b{font-size:21px;line-height:1.1;color:var(--ink);min-width:0}
.pz-no time{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--inkSoft);white-space:nowrap}
.pz-no i{font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--redDeep);white-space:nowrap}
.pz-no--fresh{border:2px solid var(--ink);padding:6px 10px 7px}
.pz-no--fresh i::before{content:"✶ "}
.pz-no--mine{background:var(--redDeep);border:2px solid var(--redDeep);box-shadow:3px 3px 0 var(--ink)}
.pz-no--mine b,.pz-no--mine time,.pz-no--mine i{color:var(--paper)}
.pz-one{margin:0;padding:14px 18px 18px;font-style:italic;font-size:18px;color:var(--inkSoft)}
.pz-cap{margin:0 18px 18px;padding-top:12px;border-top:1.5px dashed var(--ink);font-style:italic;font-size:17px;line-height:1.4;color:var(--inkSoft)}
.pz-cap b{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink)}
.pz-empty{margin:18px;padding:40px 20px 44px;text-align:center;border:1.5px dashed var(--inkSoft);background:repeating-linear-gradient(135deg,var(--stripe) 0 7px,transparent 7px 14px)}
.pz-empty h3{font-family:var(--display);font-weight:900;font-size:28px;line-height:1.05;margin:0 0 8px}
.pz-empty p{margin:0 auto;max-width:34ch;font-style:italic;font-size:19px;color:var(--inkSoft)}
@container pzd (max-width:560px){
 .pz-lead{grid-template-columns:minmax(0,1fr);padding:16px 14px 18px}
 .pz-tags{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
 .pz-reg{padding:12px 12px 16px;gap:6px}.pz-reg-h{padding:12px 12px 0}
 .pz-no b{font-size:19px}
 .pz-cap{margin:0 12px 14px}.pz-empty{margin:12px;padding:28px 14px 32px}
}

/* board + side column: link to my status, claim slip */
.pz-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:clamp(24px,3vw,40px);align-items:start}
.pz-side{display:flex;flex-direction:column;gap:28px}
.pz-side-btn{text-align:center;margin-top:18px;min-height:48px}
.pizza-page a.btn-news,.pizza-page a.btn-news:hover{color:var(--paper)}
.pz-dash{display:grid;gap:4px;padding:14px 16px;border:2px solid var(--ink);background:var(--paperLite);text-decoration:none;color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.pz-dash .kicker{margin:0}
.pz-dash b{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.05}
.pz-dash span:last-child{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--redDeep)}
.pz-dash:hover{background:var(--ink);color:var(--paper)}.pz-dash:hover span{color:var(--paper)}
@container pz (max-width:900px){.pz-board{grid-template-columns:minmax(0,1fr)}}
@container pz (min-width:901px){.pz-reader--jump{display:none}}

/* Abholschein (my status) */
.pz-status{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:clamp(24px,3vw,44px);align-items:start}
.pz-status--empty{grid-template-columns:minmax(0,560px);justify-content:center}
.pz-sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:7px;margin:0 0 26px}
.pz-sec-h h2{font-family:var(--display);font-weight:900;font-size:26px;margin:0}
.pz-sec-h span{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--inkSoft)}
.pz-slips{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:30px 22px}
.pz-slip{container:pzs/inline-size;display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 16px 20px;height:100%}
.pz-slip .kicker{margin:0}
.pz-slip .price.pz-slip-no{margin:8px 0 0;color:var(--ink);font-family:var(--mono);font-style:normal;font-feature-settings:"zero" 1;font-size:40px}
.pz-slip.pz-len-m .price.pz-slip-no{font-size:min(30px,13cqi)}
.pz-slip.pz-len-l .price.pz-slip-no{font-size:min(28px,7.6cqi)}
.pz-slip .price-note{margin:0}
.pz-slip--ready{border-color:var(--green)}
.pz-slip--ready .pz-slip-no{color:var(--green)}
.pz-slip-say{margin:6px 0 0;font-size:18px;line-height:1.35;max-width:28ch}
.pz-stamp{display:inline-block;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;padding:6px 12px;border:2.5px solid currentColor;transform:rotate(-4deg);margin:8px 0 4px;background:none;white-space:nowrap}
.pz-stamp--ready{color:var(--green)}
.pz-stamp--wait{color:var(--inkSoft)}
.pz-stamp--sm{font-size:10px;letter-spacing:.18em;padding:3px 8px;border-width:2px;margin:0}
.pz-claim{text-align:left;padding:26px 20px 20px}
.pz-claim h2{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.05;letter-spacing:-.01em;margin:0}
.pz-claim-sub{margin:8px 0 0;font-style:italic;font-size:18px;line-height:1.4;color:var(--inkSoft)}
.pz-fld{display:flex;flex-direction:column;gap:6px;margin:18px 0 20px}
.pz-fld label{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--inkSoft)}
.pz-fld input{width:100%;min-height:48px}
.pz-hint{margin:0;font-style:italic;font-size:15.5px;line-height:1.35;color:var(--inkSoft)}
.pz-fld--err label{color:var(--red)}
.pz-fld--err input{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.pz-err{margin:0;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;line-height:1.45;color:var(--red)}
.pz-err::before{content:"▲ "}
.pz-claim .btn-news{min-height:48px}
.pz-claim .fine{text-align:left}
@container pz (max-width:760px){
 .pz-status{grid-template-columns:minmax(0,1fr)}
 .pz-sec-h h2{font-size:22px}
}

@media (prefers-reduced-motion:reduce){.pizza-page *{transition:none!important;animation:none!important}}
</style>
