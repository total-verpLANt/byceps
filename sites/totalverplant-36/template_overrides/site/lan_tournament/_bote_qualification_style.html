<style>
  /* ============================================================
     QUALIFIKATION -- "Turnierbuero / Aushang" treatment.

     Used by site/lan_tournament/qualification.html, the orga-only
     qualification and playoff release page. Like the seeding page,
     it extends the site's layout base directly, so the module
     layout's lt-dark body class never applies. The markup, its
     classes and its script are the module's own (lt-seed-*, lt-qual-*);
     the module stylesheet draws the structure.

     This partial only does three things:
       1. SLIP    -- the paper sheet, breadcrumbs and page header, in
                     the same reading-slip treatment as the seeding page.
       2. TOKENS  -- it re-points the module stylesheet's --ls-*
                     variables to the theme tokens.
       3. TABLES  -- the group cards, the cut line, the tie forms and the
                     release checklist.

     Every colour is a theme token, so Spaetausgabe (dark) is
     automatic. Everything is scoped under .qualification-page.
     ============================================================ */

  /* ---------------------------------------------------------- */
  /* 1. SLIP                                                      */
  /* ---------------------------------------------------------- */

  .tournament-page.qualification-page {
    max-width: 76rem;
    margin: clamp(14px, 2vw, 28px) auto;
    padding: 28px 40px 44px;
    box-shadow:
      0 0 0 1px var(--paperDark),
      0 18px 32px -16px rgba(26, 24, 18, 0.18),
      10px 10px 0 -1px var(--paperDark),
      10px 10px 0 0 var(--inkMute),
      10px 28px 32px -16px rgba(26, 24, 18, 0.18);
  }
  @media (max-width: 720px) {
    .tournament-page.qualification-page {
      max-width: none; margin: 0; padding: 16px 14px 30px; box-shadow: none;
    }
  }
  @media (prefers-reduced-transparency: reduce), (forced-colors: active) {
    .tournament-page.qualification-page { box-shadow: 10px 10px 0 0 var(--inkMute); }
  }

  .qualification-page .crumbs {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--inkMute); margin-bottom: 0;
  }
  .qualification-page .crumbs a { color: var(--redDeep); text-decoration: none; }
  .qualification-page .crumbs a:hover { color: var(--ink); text-decoration: underline; }

  .qualification-page .head {
    font-family: var(--body); font-size: 16px; font-weight: 600; letter-spacing: normal;
    line-height: normal;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    padding: 26px 0 16px; border-bottom: 3px double var(--ink); margin-bottom: 22px;
  }
  .qualification-page .head .kick {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: var(--redDeep); margin-bottom: 8px;
  }
  .qualification-page .head h1 {
    font: 900 52px/.98 var(--display); letter-spacing: -.02em; margin: 0;
    text-wrap: balance; color: var(--ink);
  }
  @media (max-width: 47rem) {
    .qualification-page .head { padding: 18px 0 12px; margin-bottom: 18px; }
    .qualification-page .head h1 { font-size: 34px; }
  }

  /* ---------------------------------------------------------- */
  /* 2. TOKENS                                                    */
  /* ---------------------------------------------------------- */

  .qualification-page .lt-seed-site {
    --ls-ink: var(--ink);
    --ls-soft: var(--inkSoft);
    --ls-mute: var(--inkMute);
    --ls-paper: var(--paper);
    --ls-lite: var(--paperLite);
    --ls-solid: var(--paper);
    --ls-fill: var(--paperDark);
    --ls-accent: var(--redDeep);
    --ls-ok: var(--green);
    --ls-info: var(--blue);
    --ls-warn: var(--bote-amber, #8a6a0e);
    --ls-err: var(--red);
    --ls-inv-bg: var(--ink);
    --ls-inv-fg: var(--paper);
    --ls-display: var(--display);
    --ls-body: var(--body);
    --ls-mono: var(--mono);
    --ls-fs: 18px;
    --ls-fs-sm: 15.5px;
    font-size: 18px;
    line-height: 1.4;
  }

  .qualification-page .lt-seed-site code {
    font-family: var(--mono);
  }

  /* reset the theme's link and button furniture inside the board */
  .qualification-page .lt-seed-site a { text-decoration: underline; }
  .qualification-page .lt-seed-site .button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase;
    padding: 11px 16px; min-height: 44px; border: 1.5px solid var(--ink);
    background: var(--paperLite); color: var(--ink); text-align: center; border-radius: 0;
    line-height: 1.3;
  }
  .qualification-page .lt-seed-site .button:hover { background: var(--ink); color: var(--paper); }
  .qualification-page .lt-seed-site .button.is-compact { padding: 8px 12px; font-size: 10.5px; }
  .qualification-page .lt-seed-site .button.color-primary { background: var(--ink); color: var(--paper); }
  .qualification-page .lt-seed-site .button.color-primary:hover { background: var(--redDeep); border-color: var(--redDeep); }
  .qualification-page .lt-seed-site .button[disabled],
  .qualification-page .lt-seed-site .button:disabled {
    opacity: .5; cursor: not-allowed; background: transparent; color: var(--inkSoft);
    border-style: dashed;
  }
  .qualification-page .lt-seed-site .lt-seed-hintbar .button {
    background: var(--paper); color: var(--ink); border-color: var(--paper);
  }
  .qualification-page .lt-seed-site .lt-seed-strip .button { letter-spacing: .08em; }

  .qualification-page .lt-seed-site .lt-seed-panel > p,
  .qualification-page .lt-seed-site .lt-seed-panel dd { font-size: 18px; }

  @media (max-width: 560px) {
    .qualification-page .lt-seed-site { --ls-fs: 17px; font-size: 17px; }
  }

  /* ---------------------------------------------------------- */
  /* 3. TABLES AND FORMS                                          */
  /* ---------------------------------------------------------- */

  .qualification-page .lt-qual-chain {
    font-size: 17px; margin: 0 0 16px;
  }
  .qualification-page .lt-qual-chain .lt-seed-lbl {
    display: inline; margin-right: 8px;
  }

  .qualification-page .lt-qual-cards {
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px;
    margin-bottom: 24px;
  }
  .qualification-page .lt-qual-card { min-width: 0; }
  .qualification-page .lt-qual-cardh {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    border-bottom: 1.5px solid var(--ink); padding-bottom: 6px; margin-bottom: 2px;
  }
  .qualification-page .lt-qual-cardh h2 {
    font: 900 24px/1.1 var(--display); margin: 0; color: inherit;
  }
  .qualification-page .lt-qual-scroll { overflow-x: auto; max-width: 100%; }
  .qualification-page .lt-qual-scroll:focus-visible {
    outline: 2px solid var(--redDeep); outline-offset: 2px;
  }

  .qualification-page .lt-qual-table {
    width: 100%; border-collapse: collapse; font-size: 17px;
    font-variant-numeric: tabular-nums; background: none; border: 0;
  }
  .qualification-page .lt-qual-table th {
    font: 700 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--inkMute); text-align: left; padding: 8px 8px 8px 0;
    border-bottom: 1px solid var(--ink); white-space: nowrap; background: none;
  }
  .qualification-page .lt-qual-table td,
  .qualification-page .lt-qual-table tbody th {
    padding: 8px 8px 8px 0; border: 0; border-bottom: 1px dotted var(--inkMute);
    white-space: nowrap; text-align: left; font: 400 17px var(--body);
    letter-spacing: 0; text-transform: none; color: var(--ink); background: none;
  }
  .qualification-page .lt-qual-table tbody th { font-weight: 700; }
  .qualification-page .lt-qual-table .c-n,
  .qualification-page .lt-qual-table .c-pk { text-align: right; }
  .qualification-page .lt-qual-table td.c-rk {
    width: 40px; font: 700 13px var(--mono);
  }
  .qualification-page .lt-qual-table .c-pk b { font: 900 19px var(--display); }
  .qualification-page .lt-qual-table tr.is-tie td,
  .qualification-page .lt-qual-table tr.is-tie th {
    background: color-mix(in srgb, var(--bote-amber, #8a6a0e) 10%, var(--paper));
  }
  .qualification-page .lt-qual-table tr.lt-qual-cut td {
    padding: 0; border-bottom: 0; border-top: 2.5px solid var(--ink);
    height: 0; background: none;
  }
  .qualification-page .lt-qual-table tr.lt-qual-cut span {
    position: sticky; left: 0; display: inline-block; transform: translateY(-55%);
    background: var(--paper); padding: 0 8px 0 0;
    font: 700 9.5px var(--mono); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink);
  }

  @media (max-width: 560px) {
    .qualification-page .lt-qual-table .c-rk {
      position: sticky; left: 0; z-index: 2; background: var(--paper);
      min-width: 36px; width: 36px;
    }
    .qualification-page .lt-qual-table .c-nm {
      position: sticky; left: 36px; z-index: 2; background: var(--paper);
      max-width: 118px; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 4px 0 0 -3px var(--inkMute);
    }
    .qualification-page .lt-qual-table .c-pk {
      position: sticky; right: 118px; z-index: 2; background: var(--paper);
      min-width: 40px; box-shadow: -4px 0 0 -3px var(--inkMute);
    }
    .qualification-page .lt-qual-table .c-st {
      position: sticky; right: 0; z-index: 2; background: var(--paper);
      width: 118px; min-width: 118px; max-width: 118px; white-space: normal;
    }
    .qualification-page .lt-qual-table tr.is-tie .c-rk,
    .qualification-page .lt-qual-table tr.is-tie .c-nm,
    .qualification-page .lt-qual-table tr.is-tie .c-pk,
    .qualification-page .lt-qual-table tr.is-tie .c-st {
      background: color-mix(in srgb, var(--bote-amber, #8a6a0e) 10%, var(--paper));
    }
  }

  /* tie forms: the ordering list and the reason field */
  .qualification-page .lt-qual-order {
    list-style: none; margin: 6px 0 14px; padding: 0;
    display: flex; flex-direction: column; gap: 6px; max-width: 460px;
  }
  .qualification-page .lt-qual-order-item {
    display: flex; align-items: center; gap: 10px; min-height: 48px;
    padding: 4px 10px; border: 1.5px solid var(--ink); background: var(--paperLite);
  }
  .qualification-page .lt-qual-order-item label {
    flex: none; font: 700 10.5px var(--mono); letter-spacing: .12em;
    text-transform: uppercase; color: var(--inkSoft);
  }
  .qualification-page .lt-qual-order-item select { flex: 1; min-width: 0; }
  .qualification-page .lt-qual-decide textarea,
  .qualification-page .lt-qual-withdraw textarea,
  .qualification-page .lt-qual-unrelease textarea {
    max-width: 560px; width: 100%; height: auto; min-height: 4.5rem;
    margin-bottom: 10px;
  }
  .qualification-page .lt-qual-withdraw,
  .qualification-page .lt-qual-unrelease { margin-top: 8px; }
  .qualification-page .lt-qual-withdraw > summary,
  .qualification-page .lt-qual-unrelease > summary {
    display: inline-flex; margin-bottom: 10px; cursor: pointer;
  }

  /* release checklist */
  .qualification-page .lt-qual-check { list-style: none; margin: 0 0 12px; padding: 0; }
  .qualification-page .lt-qual-check li {
    display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
    border-bottom: 1px dotted var(--inkMute); font-size: 17px;
  }
  .qualification-page .lt-qual-check b {
    flex: none; font: 700 10px var(--mono); letter-spacing: .12em;
    text-transform: uppercase; height: max-content; padding: 2px 7px;
    border: 1.5px solid currentColor; color: var(--inkSoft);
  }

  .qualification-page .lt-qual-release,
  .qualification-page .lt-qual-audit { margin-top: 24px; }
</style>
