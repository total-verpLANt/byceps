<style>
  /* ============================================================
     ANMELDUNG / AUFNAHME — "Pförtnerloge" front-desk treatment.

     Shared by every page in the login + registration flow:
       site/authn/login/log_in_form.html              (Anmeldung)
       site/user/creation/create_form.html            (Aufnahmeantrag)
       common/authn/password/request_reset_form.html  (Kennwort anfordern)
       common/authn/password/reset_form.html          (Kennwort neu)
       site/user/email_address/
         request_confirmation_email_form.html         (Brief erneut)

     The stock pages had no .bote-page wrapper and rendered the
     BYCEPS form controls raw — pure-white inputs, a mint submit
     button — running full-bleed under the sticky masthead (the
     same problem the dashboard / tickets / shop pages had).

     Each template now wraps its body in the centered paper sheet
     (.bote-page .auth-page) with a .page-folio + .page-head, and
     pulls in this shared <style> partial from the head block.
     The form is re-set as a stamped "Aufnahmeschein": an inked
     paper card with a ruled form-header band, mono field labels,
     serif inputs, newspaper checkboxes and a green stamp button.
     Markup, field names, endpoints and Jinja logic are UNCHANGED
     from the stock templates — only the wrapper + classes were
     added, so validation, login.js, the consent links and the
     disable-on-submit behaviour all still work. Every colour is a
     theme token, so "Spätausgabe" (dark) is automatic.
     ============================================================ */

  /* narrow centered column; registration widens it via a modifier */
  .auth-page .auth-shell{ max-width:34rem; margin-inline:auto; width:100%; }
  .auth-page.auth-page--wide .auth-shell{ max-width:60rem; }

  /* the inked paper card (stock .main-body-box) */
  .auth-page .main-body-box{
    border:1.5px solid var(--ink); background:var(--paperLite);
    box-shadow:6px 6px 0 var(--ink); border-radius:0;
    padding:0; margin:0; overflow:hidden;
  }
  /* form-header band inside the card — the "Formular"/desk stamp */
  .auth-page .auth-cardhead{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px 18px;
    flex-wrap:wrap; padding:11px clamp(18px,2.4vw,26px) 10px;
    border-bottom:3px double var(--ink); background:var(--paper);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--inkSoft);
  }
  .auth-page .auth-cardhead .ah-form{ color:var(--redDeep); font-weight:700; }
  .auth-page .auth-cardhead .ah-no{ color:var(--inkMute); }
  .auth-page .auth-cardbody{ padding:clamp(20px,2.6vw,30px) clamp(18px,2.4vw,28px); }

  /* ===== form controls (form_field macro) ===== */
  .auth-page .form-control-block{ margin-bottom:20px; }
  .auth-page .form-control-block:last-child{ margin-bottom:0; }
  .auth-page .form-control-block.row{ display:flex; gap:clamp(14px,2vw,22px); margin-bottom:20px; }
  .auth-page .form-control-block.row > div{ margin-bottom:0; }
  .auth-page .form-control-block.row .form-control-block{ margin-bottom:0; }
  .auth-page .column--grow{ flex:1 1 0; min-width:0; }

  .auth-page .form-label{
    display:block; font-family:var(--mono); font-size:9.5px; font-weight:700;
    letter-spacing:.18em; text-transform:uppercase; color:var(--inkSoft); margin-bottom:7px;
  }
  .auth-page .form-control{
    width:100%; font-family:var(--body); font-size:19px; line-height:1.3; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--ink); border-radius:0; padding:12px 14px;
  }
  .auth-page input.form-control{ appearance:none; -webkit-appearance:none; }
  /* The paper-card input box (bg / ink colour / ink border / serif / 600 / size)
     is now asserted site-wide in totalverplant-36.css at common.css-matching
     specificity, so the per-page re-assertion that used to live here is gone.
     The global rule fixes auth, shop and every other form identically —
     including the dark-mode cream-on-white legibility bug. Only auth-specific
     state (placeholder, hover, focus, invalid) stays below. */
  .auth-page .form-control::placeholder{ color:var(--inkMute); }
  .auth-page .form-control:hover{ border-color:var(--redDeep); }
  .auth-page .form-control:focus{ outline:none; border-color:var(--redDeep); box-shadow:3px 3px 0 var(--redDeep); }
  .auth-page .form-caption{
    font-family:var(--body); font-style:italic; font-size:14px; color:var(--inkMute); margin-top:6px;
  }
  .auth-page .form-control-block.invalid .form-control{ border-color:var(--red); box-shadow:3px 3px 0 var(--red); }
  .auth-page .form-errors{
    list-style:none; margin:8px 0 0; padding:0; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.06em; color:var(--red);
  }
  .auth-page .form-errors strong{ text-transform:uppercase; letter-spacing:.12em; }

  /* ===== newspaper checkboxes (form_field_check) ===== */
  .auth-page .form-check-label{
    display:flex; gap:12px; align-items:flex-start; cursor:pointer;
    font-family:var(--body); font-size:18px; line-height:1.45; color:var(--ink);
  }
  .auth-page .form-control-block + .form-control-block:has(.form-check-label){ margin-top:-4px; }
  .auth-page .form-check-label input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; flex:0 0 auto; width:21px; height:21px; margin:1px 0 0;
    border:1.5px solid var(--ink); background:var(--paper); border-radius:0; cursor:pointer;
    display:grid; place-content:center;
  }
  .auth-page .form-check-label input[type="checkbox"]::after{
    content:'✓'; font-family:var(--mono); font-size:14px; line-height:1; color:#fff;
    transform:scale(0); transition:transform .12s ease;
  }
  .auth-page .form-check-label input[type="checkbox"]:checked{ background:var(--green); border-color:transparent; }
  .auth-page .form-check-label input[type="checkbox"]:checked::after{ transform:scale(1); }
  .auth-page .form-check-label input[type="checkbox"]:focus-visible{ outline:2px solid var(--redDeep); outline-offset:2px; }
  .auth-page .form-check-label a{ color:var(--redDeep); text-decoration:none; border-bottom:1px dashed var(--redDeep); }
  .auth-page .form-check-label a:hover{ background:rgba(168,40,28,.07); }

  /* ===== login-failed notice (driven by login.js) ===== */
  .auth-page #login-failed-notice{ max-height:6rem; overflow-y:hidden; transition:max-height 1s ease-out; margin-top:18px; }
  .auth-page #login-failed-notice.hidden{ max-height:0; transition:max-height 0s; }
  .auth-page .notification{
    display:flex; gap:12px; align-items:flex-start; border:1.5px solid var(--ink);
    border-left:7px solid var(--red); background:var(--paper); padding:13px 16px;
    box-shadow:4px 4px 0 var(--ink); border-radius:0;
    font-family:var(--body); font-style:italic; font-size:17px; line-height:1.4; color:var(--ink);
  }
  .auth-page .notification.color-warning{ border-left-color:var(--redDeep); }
  .auth-page .notification.color-info{ border-left-color:var(--ink); }
  .auth-page .notification .block-with-icon-icon{ color:var(--red); font-size:18px; flex:0 0 auto; line-height:1.2; }
  .auth-page .notification .block-with-icon-icon .icon{ width:1em; height:1em; }

  /* ===== submit / cancel buttons (form_buttons) ===== */
  .auth-page .button-row{ display:flex; gap:12px; flex-wrap:wrap; margin:24px 0 0; }
  .auth-page .button-row.is-hcentered{ justify-content:stretch; }
  .auth-page .button{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    padding:15px 32px; border:1.5px solid var(--ink); background:var(--paperLite); color:var(--ink);
    text-decoration:none; cursor:pointer; border-radius:0; box-shadow:4px 4px 0 var(--ink);
    transition:transform .14s ease, box-shadow .14s ease, background-color .14s, color .14s, filter .14s;
  }
  .auth-page .button:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  .auth-page .button:active{ transform:translate(0,0); box-shadow:2px 2px 0 var(--ink); }
  .auth-page .button.color-primary{
    flex:1 1 auto; background:var(--green); color:#fff; border-color:transparent; box-shadow:4px 4px 0 var(--ink);
  }
  .auth-page .button.color-primary:hover{ filter:brightness(1.08); }
  .auth-page .button.is-outlined{ flex:0 0 auto; background:transparent; }

  /* ===== help ledger (login: register / confirm / reset links) ===== */
  .auth-page .auth-help{
    max-width:34rem; margin:22px auto 0; padding-top:16px; border-top:3px double var(--ink);
  }
  .auth-page .auth-help p{
    display:flex; flex-wrap:wrap; gap:6px 8px; align-items:baseline; margin:0 0 9px;
    font-family:var(--body); font-style:italic; font-size:17px; line-height:1.4; color:var(--inkSoft);
  }
  .auth-page .auth-help p:last-child{ margin-bottom:0; }
  .auth-page .auth-help a{
    font-family:var(--mono); font-style:normal; font-size:11px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--redDeep); text-decoration:none;
    border-bottom:1px dashed var(--redDeep);
  }
  .auth-page .auth-help a:hover{ background:rgba(168,40,28,.07); }

  @media (max-width:600px){
    .auth-page .form-control-block.row{ flex-direction:column; gap:20px; }
    .auth-page .button.color-primary{ width:100%; }
  }
</style>
