<style>
  /* ============================================================
     SHOP ORDERS — "Anzeigenkontor" order-desk treatment.

     The stock shop pages (order_form, order_single_form,
     orders/index, orders/view) had no .bote-page wrapper, so the
     billing form, the .itemlist tables and the buttons ran
     full-bleed across the viewport and slid under the sticky
     masthead — the same problem the dashboard/tickets pages had.

     Each of those templates now wraps its body in the centered
     1320px paper sheet (.bote-page .order-page) and pulls in this
     shared style block from each page's head block. We re-set the stock
     BYCEPS form controls, .itemlist ledgers, payment-state tags
     and buttons as newspaper "Bestellschein" furniture. Every
     colour is a theme token, so "Spätausgabe" (dark) is automatic.
     ============================================================ */

  /* notice slips (render_notification) */
  .order-page .notification{
    display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--ink);
    border-left:7px solid var(--redDeep);background:var(--paperLite);padding:15px 20px;
    box-shadow:4px 4px 0 var(--ink);margin:0 0 22px;border-radius:0;max-width:none;
  }
  .order-page .notification.color-info{border-left-color:var(--ink);}
  .order-page .notification .block-with-icon-icon{
    color:var(--redDeep);font-size:20px;line-height:1.1;flex:0 0 auto;
  }
  .order-page .notification .block-with-icon-icon .icon{width:1em;height:1em;}
  .order-page .notification .block-with-icon-body{
    font-family:var(--body);font-style:italic;font-size:18px;line-height:1.4;color:var(--ink);
  }

  /* section headings — "Rechnungsanschrift", "Produkte", "Zahlung" */
  .order-page h2{
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--redDeep);font-weight:700;margin:32px 0 14px;padding-bottom:8px;
    border-bottom:1.5px solid var(--ink);
  }
  .order-page h3{
    font-family:var(--display);font-style:italic;font-weight:700;font-size:22px;
    margin:18px 0 10px;color:var(--ink);letter-spacing:-.01em;
  }

  /* boxed sections */
  .order-page .main-body-box{
    border:1.5px solid var(--ink);background:var(--paperLite);box-shadow:5px 5px 0 var(--ink);
    padding:22px clamp(18px,2.4vw,26px);margin:0 0 10px;border-radius:0;
  }
  .order-page .block{
    font-family:var(--body);font-size:18px;line-height:1.45;color:var(--ink);margin:0 0 16px;
  }
  .order-page .block strong{font-weight:700;}

  /* data label/value pairs (view page, payment notes) */
  .order-page .data-label{
    font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--inkMute);margin-bottom:4px;
  }
  .order-page .data-value{
    font-family:var(--body);font-size:18px;line-height:1.35;color:var(--ink);margin-bottom:16px;
  }
  .order-page .data-value:last-child{margin-bottom:0;}
  .order-page .data-value a{color:var(--ink);border-bottom:1px dashed var(--inkSoft);text-decoration:none;}
  .order-page .data-value a:hover{color:var(--redDeep);border-bottom-color:var(--redDeep);}

  /* flex rows used by the orderer block + view page */
  .order-page .row{display:flex;gap:clamp(16px,2.2vw,36px);flex-wrap:wrap;}
  .order-page .row--space-between{justify-content:space-between;align-items:flex-start;}
  .order-page .column--grow{flex:1 1 0;min-width:0;}

  /* ===== form controls (form_field macro) ===== */
  .order-page .form-control-block{margin-bottom:16px;}
  .order-page .form-control-block.row{margin-bottom:16px;gap:clamp(12px,1.6vw,20px);}
  .order-page .form-control-block.row > div{margin-bottom:0;}
  .order-page .form-control-block.row .form-control-block{margin-bottom:0;}
  .order-page .form-label{
    display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--inkSoft);margin-bottom:6px;
  }
  .order-page .form-control{
    width:100%;font-family:var(--body);font-size:18px;line-height:1.3;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--ink);border-radius:0;padding:10px 13px;
  }
  .order-page input.form-control{appearance:none;-webkit-appearance:none;}
  .order-page select.form-control{cursor:pointer;}
  .order-page .form-control::placeholder{color:var(--inkMute);}
  .order-page .form-control:focus{outline:none;border-color:var(--redDeep);box-shadow:3px 3px 0 var(--redDeep);}
  .order-page .form-control:hover{border-color:var(--redDeep);}
  .order-page .form-caption{
    font-family:var(--body);font-style:italic;font-size:14px;color:var(--inkMute);margin-top:5px;
  }
  .order-page .form-control-block.invalid .form-control{border-color:var(--red);}
  .order-page .form-errors{
    list-style:none;margin:7px 0 0;padding:0;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.06em;color:var(--red);
  }
  .order-page .form-errors strong{text-transform:uppercase;letter-spacing:.12em;}

  /* ===== ledger tables (.itemlist) — orders list + products ===== */
  .order-page .itemlist{width:100%;border-collapse:collapse;margin:0 0 8px;}
  .order-page .itemlist thead th{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--inkMute);font-weight:700;text-align:left;padding:10px 14px 9px;border-bottom:3px double var(--ink);
    white-space:nowrap;
  }
  .order-page .itemlist th.number,.order-page .itemlist td.number{text-align:right;}
  .order-page .itemlist tbody td{
    font-family:var(--body);font-size:18px;color:var(--ink);padding:13px 14px;
    border-bottom:1px solid var(--paperDark);vertical-align:middle;
  }
  .order-page .itemlist.is-vcentered tbody td{vertical-align:middle;}
  .order-page .itemlist tbody tr:last-child td{border-bottom:1.5px solid var(--ink);}
  .order-page .itemlist tbody tr.dimmed{opacity:.5;}
  .order-page .itemlist tbody tr.dimmed em{font-family:var(--body);font-style:italic;color:var(--inkMute);}
  .order-page .itemlist td .order-number,
  .order-page .itemlist td strong a{
    font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.04em;
    color:var(--redDeep);text-decoration:none;border-bottom:1px dashed transparent;
  }
  .order-page .itemlist td strong a:hover{border-bottom-color:var(--redDeep);}
  .order-page .itemlist td.nowrap{white-space:nowrap;}
  .order-page .itemlist tfoot th,
  .order-page .itemlist tfoot td{
    padding:14px 14px;border-top:3px double var(--ink);
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--inkSoft);font-weight:700;
  }
  .order-page .itemlist tfoot .bignumber,
  .order-page .itemlist .bignumber{
    font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;
    letter-spacing:-.01em;color:var(--ink);text-transform:none;
  }
  .order-page .product-image{
    border-radius:0;border:1.5px solid var(--ink);background:var(--paperDark);
    filter:grayscale(1) sepia(.30) contrast(1.05);min-width:48px;width:80px;height:auto;
    transition:filter .4s ease;
  }
  /* bloom the product print to full colour on hover — same treatment as the
     profile / board / gallery prints (sepia at rest → filter:none on hover) */
  .order-page .product-image:hover{filter:none;}
  .order-page .itemlist .form-control{width:auto;min-width:64px;padding:7px 10px;font-size:16px;}

  /* ===== payment-state tags (render_tag) ===== */
  .order-page .tag{
    display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border:1.5px solid var(--ink);
    white-space:nowrap;border-radius:0;
  }
  .order-page .tag .icon{width:11px;height:11px;}
  .order-page .order-payment-state--paid{background:var(--green,#3b5a2a);color:#fff;border-color:transparent;}
  .order-page .order-payment-state--open{background:var(--paper);color:var(--redDeep);border-color:var(--redDeep);border-style:dashed;}
  .order-page .order-payment-state--canceled{background:var(--inkSoft);color:var(--paper);border-color:transparent;}
  .order-page .tag.color-danger{background:var(--red);color:#fff;border-color:transparent;}
  .order-page .tag.color-info{background:var(--blue,#1f3a64);color:#fff;border-color:transparent;}

  /* ===== buttons (form_buttons + .button) ===== */
  .order-page .button-row{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 4px;}
  .order-page .button-row.is-hcentered{justify-content:center;}
  .order-page .button-row.is-right-aligned{justify-content:flex-end;margin:0;}
  .order-page .button-row.is-compact{margin:0;}
  .order-page .button{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    padding:14px 32px;border:1.5px solid var(--ink);background:var(--paperLite);color:var(--ink);
    text-decoration:none;cursor:pointer;border-radius:0;box-shadow:4px 4px 0 var(--ink);
    transition:transform .14s ease,box-shadow .14s ease,background-color .14s,color .14s;
  }
  .order-page .button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
  .order-page .button:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--ink);}
  .order-page .button .icon{width:1em;height:1em;}
  .order-page .button.color-primary{background:var(--green,#3b5a2a);color:#fff;border-color:transparent;box-shadow:4px 4px 0 var(--ink);}
  .order-page .button.color-primary:hover{filter:brightness(1.06);}
  .order-page .button.is-compact{padding:9px 18px;font-size:10.5px;}
  .order-page .button.is-clear{background:transparent;box-shadow:none;border-color:transparent;}
  .order-page .button.is-clear:hover{transform:none;box-shadow:none;color:var(--redDeep);}

  /* breadcrumb back-link as a mono kicker */
  .order-page .crumb-back{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--inkSoft);margin:0 0 4px;
  }
  .order-page .crumb-back a{color:var(--redDeep);text-decoration:none;border-bottom:1px dashed transparent;}
  .order-page .crumb-back a:hover{border-bottom-color:var(--redDeep);}

  /* empty / no-data slip */
  .order-page .order-empty{
    border:1.5px dashed var(--inkSoft);padding:26px 24px;
    background:repeating-linear-gradient(135deg,rgba(128,116,86,.10) 0 7px,transparent 7px 14px);
  }
  .order-page .order-empty .oe-head{
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--redDeep);font-weight:700;margin:0 0 8px;
  }
  .order-page .order-empty p{
    font-family:var(--body);font-style:italic;font-size:19px;line-height:1.45;color:var(--ink);
    margin:0;max-width:62ch;
  }

  /* paypal/stripe payment regions read as plain editorial text */
  .order-page #paypal-button-container{margin:1.4rem auto 0;}

  @media (max-width:720px){
    .order-page .row{gap:14px;}
    .order-page .itemlist thead{display:none;}
    .order-page .button{width:100%;}
  }
</style>
