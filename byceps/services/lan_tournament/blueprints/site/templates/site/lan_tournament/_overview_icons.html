{#- Outline glyphs for the tournament overview. Inline SVG on purpose: no
    icon font, no third-party request. Sites show or size them in CSS. -#}
{%- macro render_overview_icon(name) -%}
<svg class="ov-icon ov-icon--{{ name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'calendar' -%}
  <rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
  {%- elif name == 'gamepad' -%}
  <rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="11.5" r=".9" fill="currentColor"/><circle cx="17.7" cy="13.7" r=".9" fill="currentColor"/>
  {%- elif name == 'person' -%}
  <circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4.2 3.4-6.5 7.5-6.5s7.5 2.3 7.5 6.5"/>
  {%- elif name == 'group' -%}
  <circle cx="9" cy="8.5" r="3.3"/><path d="M2.5 20c0-3.6 2.9-5.8 6.5-5.8s6.5 2.2 6.5 5.8"/><circle cx="17" cy="9.5" r="2.6"/><path d="M16.6 14.4c3 .2 4.9 2 4.9 5.1"/>
  {%- elif name == 'award' -%}
  <circle cx="12" cy="9" r="5.5"/><path d="M8.7 13.6 7 21l5-2.6 5 2.6-1.7-7.4"/>
  {%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".9" fill="currentColor"/>
  {%- elif name == 'document' -%}
  <path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9.5 13h6M9.5 17h6"/>
  {%- endif -%}
</svg>
{%- endmacro -%}
